    </filter>
  </defs>
  <g transform="translate(64 321.6) scale(2.8)" font-family="Roboto, Helvetica, sans-serif">
    <rect width="320" height="136" rx="14" fill="#ffffff" filter="url(#shadow)" />
    <text x="16" y="31" font-size="14" fill="#626265">Solar surplus</text>
    <text x="16" y="79" font-size="32" font-weight="700" fill="#1c1c1c">820 W</text>
    <text x="16" y="115" font-size="14" fill="#626265">Updated 12/09/2026, 12:34:00</text>
  </g>
</svg>
