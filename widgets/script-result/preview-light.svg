<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Script Result — light preview</title>
  <defs>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dy="4" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#eaeaf1" />
  <g transform="translate(64 321.6) scale(2.8)">
    <rect width="320" height="136" rx="14" fill="#ffffff" filter="url(#shadow)" />
    <rect x="16" y="20" width="96" height="12" rx="6" fill="#f4f4fa" />
    <rect x="16" y="54" width="120" height="28" rx="14" fill="#f4f4fa" />
    <rect x="16" y="104" width="160" height="12" rx="6" fill="#f4f4fa" />
  </g>
</svg>
