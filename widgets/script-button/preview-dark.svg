<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Script Button — dark preview</title>
  <defs>
    <linearGradient id="play" x1="0.329" y1="0.030" x2="0.671" y2="0.970">
      <stop stop-color="#66b4fc" />
      <stop offset="0.6" stop-color="#0082fa" />
      <stop offset="1" stop-color="#0068c8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
