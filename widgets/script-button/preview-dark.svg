    <svg x="28" y="60" width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
      <path d="M7 4.5a1.5 1.5 0 0 1 2.3-1.27l12 7.5a1.5 1.5 0 0 1 0 2.54l-12 7.5A1.5 1.5 0 0 1 7 19.5z" />
    </svg>
    <rect x="72" y="62" width="116" height="16" rx="8" fill="#2b2c36" />
    <rect x="16" y="108" width="124" height="12" rx="6" fill="#2b2c36" />
